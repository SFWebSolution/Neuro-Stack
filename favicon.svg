  <path d="M32 13 L51 22.5 L32 32 L13 22.5 Z" fill="#ffffff" fill-opacity="0.97"/>

  <!-- Neuro node cluster -->
  <g stroke="#0E2A5A" stroke-width="1.9" stroke-linecap="round">
    <path d="M32 24.5 L32 18.5"/>
    <path d="M32 24.5 L40.3 27.8"/>
    <path d="M32 24.5 L23.7 27.8"/>
  </g>
  <circle cx="32" cy="18.5" r="2.3" fill="#0E2A5A"/>
  <circle cx="40.3" cy="27.8" r="2.3" fill="#0E2A5A"/>
  <circle cx="23.7" cy="27.8" r="2.3" fill="#0E2A5A"/>
  <circle cx="32" cy="24.5" r="3" fill="#FFC24B"/>
</svg>




