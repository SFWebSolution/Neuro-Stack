<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="NeuroStack">
  <defs>
    <linearGradient id="nvGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00D4FF"/>
      <stop offset="0.5" stop-color="#4C7BFF"/>
      <stop offset="1" stop-color="#7B4DFF"/>
    </linearGradient>
    <linearGradient id="nvShine" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="1.5" y="1.5" width="61" height="61" rx="15" fill="url(#nvGrad)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="15" fill="url(#nvShine)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="15" fill="none" stroke="#ffffff" stroke-opacity="0.24" stroke-width="1.2"/>

  <!-- Stack -->
  <path d="M32 31 L54 42 L32 53 L10 42 Z" fill="#ffffff" fill-opacity="0.30" stroke="#ffffff" stroke-opacity="0.18" stroke-width="0.8" stroke-linejoin="round"/>
  <path d="M32 23 L54 34 L32 45 L10 34 Z" fill="#ffffff" fill-opacity="0.58" stroke="#ffffff" stroke-opacity="0.18" stroke-width="0.8" stroke-linejoin="round"/>
  <path d="M32 15 L54 26 L32 37 L10 26 Z" fill="#ffffff" fill-opacity="0.97" stroke="#ffffff" stroke-opacity="0.85" stroke-width="1.1" stroke-linejoin="round"/>

  <!-- Neuro node cluster -->
  <g stroke="#0E2A5A" stroke-width="2.6" stroke-linecap="round">
    <path d="M32 26 L32 18.5"/>
    <path d="M32 26 L43 26"/>
    <path d="M32 26 L21 26"/>
  </g>
  <circle cx="32" cy="18.5" r="2.8" fill="#0E2A5A"/>
  <circle cx="43" cy="26" r="2.8" fill="#0E2A5A"/>
  <circle cx="21" cy="26" r="2.8" fill="#0E2A5A"/>
  <circle cx="32" cy="26" r="3.3" fill="#FFC24B"/>
