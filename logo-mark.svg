<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="NeuroStack">
  <defs>
    <linearGradient id="nvGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00D4FF"/>
      <stop offset="0.5" stop-color="#4C7BFF"/>
      <stop offset="1" stop-color="#7B4DFF"/>
    </linearGradient>
    <linearGradient id="nvShine" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Badge -->
  <rect x="12" y="12" width="488" height="488" rx="116" fill="url(#nvGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="116" fill="url(#nvShine)"/>
  <rect x="12" y="12" width="488" height="488" rx="116" fill="none" stroke="#ffffff" stroke-opacity="0.24" stroke-width="7"/>

  <!-- Stack: three isometric layers, bottom to top -->
  <path d="M256 248 L432 336 L256 424 L80 336 Z" fill="#ffffff" fill-opacity="0.30" stroke="#ffffff" stroke-opacity="0.18" stroke-width="4" stroke-linejoin="round"/>
  <path d="M256 184 L432 272 L256 360 L80 272 Z" fill="#ffffff" fill-opacity="0.58" stroke="#ffffff" stroke-opacity="0.18" stroke-width="4" stroke-linejoin="round"/>
  <path d="M256 120 L432 208 L256 296 L80 208 Z" fill="#ffffff" fill-opacity="0.97" stroke="#ffffff" stroke-opacity="0.85" stroke-width="6" stroke-linejoin="round"/>

  <!-- Neuro: node cluster on the top layer -->
  <g stroke="#0E2A5A" stroke-width="16" stroke-linecap="round">
    <path d="M256 208 L256 148"/>
    <path d="M256 208 L344 208"/>
    <path d="M256 208 L168 208"/>
  </g>
  <circle cx="256" cy="148" r="17" fill="#0E2A5A"/>
  <circle cx="344" cy="208" r="17" fill="#0E2A5A"/>
  <circle cx="168" cy="208" r="17" fill="#0E2A5A"/>
  <circle cx="256" cy="208" r="20" fill="#FFC24B"/>
</svg>



