<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="NeuroStack">
  <defs>
    <linearGradient id="nvGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00D4FF"/>
      <stop offset="0.5" stop-color="#4C7BFF"/>
      <stop offset="1" stop-color="#7B4DFF"/>
    </linearGradient>
    <linearGradient id="nvShine" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.26"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Badge -->
  <rect x="12" y="12" width="488" height="488" rx="116" fill="url(#nvGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="116" fill="url(#nvShine)"/>
  <rect x="12" y="12" width="488" height="488" rx="116" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="7"/>

  <!-- Stack: three isometric layers -->
  <path d="M256 240 L408 316 L256 392 L104 316 Z" fill="#ffffff" fill-opacity="0.30"/>
  <path d="M256 172 L408 248 L256 324 L104 248 Z" fill="#ffffff" fill-opacity="0.58"/>
  <path d="M256 104 L408 180 L256 256 L104 180 Z" fill="#ffffff" fill-opacity="0.97"/>

  <!-- Neuro: node cluster anchored on the top layer -->
  <g stroke="#0E2A5A" stroke-width="13" stroke-linecap="round">
    <path d="M256 196 L256 148"/>
    <path d="M256 196 L322 222"/>
    <path d="M256 196 L190 222"/>
  </g>
  <circle cx="256" cy="148" r="16" fill="#0E2A5A"/>
  <circle cx="322" cy="222" r="16" fill="#0E2A5A"/>
  <circle cx="190" cy="222" r="16" fill="#0E2A5A"/>
  <circle cx="256" cy="196" r="21" fill="#FFC24B"/>
</svg>




